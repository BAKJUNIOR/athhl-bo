<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 md:gap-6">
  <!-- Metric Item Start -->
  <div class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03] md:p-6">
    <div class="flex items-center justify-center w-12 h-12 bg-gray-100 rounded-xl dark:bg-gray-800" [innerHTML]="icons.mailIcon | safeHtml">
    </div>
    <div class="flex items-end justify-between mt-5">
      <div>
        <span class="text-sm text-gray-500 dark:text-gray-400">Demandes de devis (ce mois)</span>
        <h4 class="mt-2 font-bold text-gray-800 text-title-sm dark:text-white/90">{{ quotesThisMonth }}</h4>
      </div>
      <app-badge [color]="quotesTrend >= 0 ? 'success' : 'error'">
        <span [innerHTML]="(quotesTrend >= 0 ? icons.arrowUpIcon : icons.arrowDownIcon) | safeHtml"></span>
        {{ (quotesTrend >= 0 ? '+' : '') + quotesTrend }}%
      </app-badge>
    </div>
  </div>
  <!-- Metric Item End -->

  <!-- Metric Item Start -->
  <div class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03] md:p-6">
    <div class="flex items-center justify-center w-12 h-12 bg-gray-100 rounded-xl dark:bg-gray-800" [innerHTML]="icons.groupIcon | safeHtml">
    </div>
    <div class="flex items-end justify-between mt-5">
      <div>
        <span class="text-sm text-gray-500 dark:text-gray-400">Candidatures (ce mois)</span>
        <h4 class="mt-2 font-bold text-gray-800 text-title-sm dark:text-white/90">{{ applicationsThisMonth }}</h4>
      </div>
      <app-badge [color]="applicationsTrend >= 0 ? 'success' : 'error'">
        <span [innerHTML]="(applicationsTrend >= 0 ? icons.arrowUpIcon : icons.arrowDownIcon) | safeHtml"></span>
        {{ (applicationsTrend >= 0 ? '+' : '') + applicationsTrend }}%
      </app-badge>
    </div>
  </div>
  <!-- Metric Item End -->
</div>
