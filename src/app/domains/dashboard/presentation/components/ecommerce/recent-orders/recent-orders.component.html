<div
  class="flex h-full flex-col overflow-hidden rounded-2xl border border-gray-200 bg-white px-4 pb-2 pt-4 dark:border-gray-800 dark:bg-white/[0.03] sm:px-6">
  <h3 class="mb-2 text-lg font-semibold text-gray-800 dark:text-white/90">
    Aperçu du contenu
  </h3>

  <div class="max-w-full overflow-x-auto">
    <table class="w-full text-start">
      <thead class="border-y border-gray-100 dark:border-gray-800">
        <tr>
          <th class="py-2 font-medium text-start text-gray-500 text-theme-xs dark:text-gray-400">Indicateur</th>
          <th class="py-2 font-medium text-start text-gray-500 text-theme-xs dark:text-gray-400">Section</th>
          <th class="py-2 font-medium text-start text-gray-500 text-theme-xs dark:text-gray-400">Valeur</th>
          <th class="py-2 font-medium text-start text-gray-500 text-theme-xs dark:text-gray-400">Statut</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100 dark:divide-gray-800">
        @for (kpi of kpis; track kpi.name) {
        <tr [routerLink]="kpi.path" class="cursor-pointer hover:bg-gray-50 dark:hover:bg-white/[0.02]">
          <td class="py-2 text-start">
            <div class="flex items-center gap-2.5">
              <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-purple-500/10 text-purple-500 [&_svg]:size-4" [innerHTML]="kpi.icon | safeHtml"></div>
              <p class="font-medium text-gray-800 text-theme-xs dark:text-white/90">
                {{ kpi.name }}
              </p>
            </div>
          </td>
          <td class="py-2 text-start text-gray-500 text-theme-xs dark:text-gray-400">
            {{ kpi.section }}
          </td>
          <td class="py-2 text-start text-gray-500 text-theme-xs dark:text-gray-400">
            {{ kpi.value }}
          </td>
          <td class="py-2 text-start">
            <app-badge size="sm" [color]="badgeColor(kpi.status)">
              {{ kpi.statusLabel }}
            </app-badge>
          </td>
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>
